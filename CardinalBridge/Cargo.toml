[package]
name = "cardinal-bridge"
version = "0.1.0"
edition = "2024"
description = "C API over Cardinal's search engine (Vendor/cardinal) for fileCommander's search"
license = "MIT"
publish = false

[lib]
name = "cardinal_bridge"
crate-type = ["staticlib"]

[dependencies]
search-cache = { path = "../Vendor/cardinal/search-cache" }
search-cancel = { path = "../Vendor/cardinal/search-cancel" }
cardinal-sdk = { path = "../Vendor/cardinal/cardinal-sdk" }
crossbeam-channel = "0.5.15"
# Already in the build through search-cache; used for the content scan.
libc = "0.2"
memchr = "2.7"
rayon = "1.9"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
